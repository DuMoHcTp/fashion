import { NextRequest, NextResponse } from 'next/server'
import { db } from '@/lib/db'
import { analyzeWardrobeMatch, type WardrobeItemBrief } from '@/lib/wardrobe-ai'

export const runtime = 'nodejs'
export const maxDuration = 180

function parseItem(item: {
  id: string
  name: string
  category: string
  subtype: string
  colors: string
  style: string
  seasons: string
  material: string | null
}): WardrobeItemBrief {
  return {
    id: item.id,
    name: item.name,
    category: item.category,
    subtype: item.subtype,
    colors: JSON.parse(item.colors) as string[],
    style: item.style,
    seasons: JSON.parse(item.seasons) as string[],
    material: item.material,
  }
}

/**
 * POST /api/match — анализ совместимости вещи с гардеробом
 * Тело: { itemId }
 * Результат сохраняется в БД и возвращается клиенту.
 */
export async function POST(req: NextRequest) {
  try {
    const body = await req.json()
    const itemId: string = body?.itemId
    if (!itemId) {
      return NextResponse.json({ error: 'Не указан itemId' }, { status: 400 })
    }

    const targetItem = await db.clothingItem.findUnique({ where: { id: itemId } })
    if (!targetItem) {
      return NextResponse.json({ error: 'Вещь не найдена' }, { status: 404 })
    }

    const others = await db.clothingItem.findMany({
      where: { id: { not: itemId } },
      orderBy: { createdAt: 'desc' },
    })

    const target = parseItem(targetItem)
    const wardrobe = others.map(parseItem)

    const analysis = await analyzeWardrobeMatch(target, wardrobe)

    const saved = await db.matchAnalysis.upsert({
      where: { itemId },
      create: {
        itemId,
        score: analysis.score,
        summary: analysis.summary,
        matches: JSON.stringify(analysis.matches),
        outfits: JSON.stringify(analysis.outfits),
        gaps: JSON.stringify(analysis.gaps),
      },
      update: {
        score: analysis.score,
        summary: analysis.summary,
        matches: JSON.stringify(analysis.matches),
        outfits: JSON.stringify(analysis.outfits),
        gaps: JSON.stringify(analysis.gaps),
      },
    })

    return NextResponse.json({
      analysis: {
        id: saved.id,
        itemId: saved.itemId,
        score: saved.score,
        summary: saved.summary,
        matches: JSON.parse(saved.matches),
        outfits: JSON.parse(saved.outfits),
        gaps: JSON.parse(saved.gaps),
        updatedAt: saved.updatedAt,
      },
    })
  } catch (error) {
    console.error('Ошибка анализа совместимости:', error)
    const message = error instanceof Error ? error.message : 'Не удалось выполнить анализ'
    return NextResponse.json({ error: message }, { status: 500 })
  }
}
